variables:
  CIVITAS_CORE_VERSION: "v1.7.2"
  ANSIBLE_DEV_TOOLS_IMAGE: "ghcr.io/ansible/community-ansible-dev-tools@sha256:70f705fee2386deb320598ea011812292598111cca85f0107ee9479062628e79"

stages:
  - validate
  - maintenance

validate-addon:
  stage: validate
  tags:
    - linux
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success
  script:
    - |
      set -euo pipefail

      CORE_DIRECTORY="$CI_PROJECT_DIR/.civitas-core-validation"
      ADDON_DIRECTORY="$CORE_DIRECTORY/core_platform/addons/baikor_r_addon"

      git clone \
        --branch "$CIVITAS_CORE_VERSION" \
        --depth 1 \
        https://gitlab.com/civitas-connect/civitas-core/civitas-core.git \
        "$CORE_DIRECTORY"
      mkdir -p "$ADDON_DIRECTORY"
      git archive --format=tar "$CI_COMMIT_SHA" | tar -xf - -C "$ADDON_DIRECTORY"

      docker run --rm \
        --user "$(id -u):$(id -g)" \
        --env HOME=/tmp \
        --volume "$CORE_DIRECTORY:/core" \
        --workdir /core \
        "$ANSIBLE_DEV_TOOLS_IMAGE" \
        sh -lc '
          ansible-galaxy collection install -r ansible-collections.yml &&
          ansible-lint --offline core_platform/addons/baikor_r_addon &&
          python3 core_platform/addons/baikor_r_addon/scripts/test_image_registry.py
        '

validate-node-red-examples:
  stage: validate
  tags:
    - linux
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success
  script:
    - >-
      docker run --rm
      --user "$(id -u):$(id -g)"
      --volume "$CI_PROJECT_DIR:/addon:ro"
      --workdir /addon
      node:22-alpine
      node scripts/test_node_red_examples.cjs

renovate:
  stage: maintenance
  image: renovate/renovate:latest
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: on_success
    - when: never
  script:
    - renovate
  variables:
    RENOVATE_TOKEN: $GITLAB_TOKEN
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
