name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CIVITAS_CORE_VERSION: v1.7.2
  ANSIBLE_DEV_TOOLS_IMAGE: ghcr.io/ansible/community-ansible-dev-tools@sha256:70f705fee2386deb320598ea011812292598111cca85f0107ee9479062628e79
  POSTGIS_TEST_IMAGE: postgis/postgis:16-3.4
  K3D_VERSION: v5.9.0
  K3S_TEST_IMAGE: rancher/k3s:v1.35.4-k3s1

jobs:
  validate-addon:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate addon
        shell: bash
        run: |
          set -euo pipefail

          CORE_DIRECTORY="$RUNNER_TEMP/civitas-core-validation"
          ADDON_DIRECTORY="$CORE_DIRECTORY/core_platform/addons/baikor_r_addon"

          git clone \
            --branch "$CIVITAS_CORE_VERSION" \
            --depth 1 \
            https://gitlab.com/civitas-connect/civitas-core/civitas-core.git \
            "$CORE_DIRECTORY"
          mkdir -p "$ADDON_DIRECTORY"
          git archive --format=tar "$GITHUB_SHA" | tar -xf - -C "$ADDON_DIRECTORY"

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$CORE_DIRECTORY:/core" \
            --workdir /core \
            "$ANSIBLE_DEV_TOOLS_IMAGE" \
            sh -lc '
              ansible-galaxy collection install -r ansible-collections.yml &&
              ansible-lint --offline core_platform/addons/baikor_r_addon
            '

  regression-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Install template test dependencies
        run: python -m pip install Jinja2==3.1.6 PyYAML==6.0.3

      # Explicit modules keep Docker/Kubernetes integration scripts out of discovery.
      - name: Test registry, preflight and GeoServer templates
        run: >-
          python -m unittest -v scripts.test_image_registry scripts.test_geoserver_datastore
          scripts.test_geoserver_feature_types scripts.test_helm_values
          scripts.test_keycloak_permissions

      - name: Test operator ownership and Node-RED examples
        run: |
          python scripts/test_operator_ownership.py
          node scripts/test_node_red_examples.cjs

      - name: Restore the application connection-string driver
        run: |
          dotnet new classlib --framework net10.0 --no-restore --output "$RUNNER_TEMP/connection-string-driver"
          dotnet add "$RUNNER_TEMP/connection-string-driver" package Npgsql --version 10.0.3

      - name: Test rendered Npgsql connection strings
        shell: pwsh
        run: >-
          ./scripts/test_database_connection_strings.ps1
          -NpgsqlAssemblyPath "$HOME/.nuget/packages/npgsql/10.0.3/lib/net8.0/Npgsql.dll"

      - name: Test database bootstrap and owner privileges
        run: |
          docker pull "$POSTGIS_TEST_IMAGE"
          python scripts/test_database_owner.py --image "$POSTGIS_TEST_IMAGE"

  keycloak-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate disposable identity credentials
        shell: bash
        run: |
          PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$PASSWORD"
          echo "BAIKOR_TEST_ADMIN_USERNAME=baikor-ci-admin" >> "$GITHUB_ENV"
          echo "BAIKOR_TEST_ADMIN_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
      - name: Test actual Keycloak provisioning and legacy editor upgrade
        run: >-
          docker compose --project-name baikor-keycloak-ci --file scripts/keycloak-tests.compose.yaml
          up --abort-on-container-exit --exit-code-from test --attach test
      - name: Remove disposable Keycloak services
        if: always()
        env:
          BAIKOR_TEST_ADMIN_USERNAME: cleanup-placeholder
          BAIKOR_TEST_ADMIN_PASSWORD: cleanup-placeholder
        run: >-
          docker compose --project-name baikor-keycloak-ci --file scripts/keycloak-tests.compose.yaml
          down --volumes --remove-orphans

  kubernetes-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Kubernetes test dependencies
        run: |
          python -m pip install ansible-core==2.18.6 kubernetes==33.1.0 Jinja2==3.1.6 PyYAML==6.0.3
          git clone --branch "$CIVITAS_CORE_VERSION" --depth 1 \
            https://gitlab.com/civitas-connect/civitas-core/civitas-core.git "$RUNNER_TEMP/civitas-core"
          ansible-galaxy collection install -r "$RUNNER_TEMP/civitas-core/ansible-collections.yml"
          curl --fail --silent --show-error --location \
            "https://github.com/k3d-io/k3d/releases/download/$K3D_VERSION/k3d-linux-amd64" \
            --output "$RUNNER_TEMP/k3d"
          echo "06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0  $RUNNER_TEMP/k3d" | sha256sum --check --status
          chmod +x "$RUNNER_TEMP/k3d"

      - name: Create a disposable test cluster
        run: |
          "$RUNNER_TEMP/k3d" cluster create baikor-ci --image "$K3S_TEST_IMAGE" \
            --no-lb --kubeconfig-update-default=false --kubeconfig-switch-context=false --wait
          "$RUNNER_TEMP/k3d" kubeconfig get baikor-ci > "$RUNNER_TEMP/baikor-ci.kubeconfig"
          docker pull "$POSTGIS_TEST_IMAGE"
          "$RUNNER_TEMP/k3d" image import "$POSTGIS_TEST_IMAGE" --cluster baikor-ci

      - name: Test namespace security and Pod admission
        run: >-
          python scripts/test_namespace_security.py
          --core-root "$RUNNER_TEMP/civitas-core"
          --kubeconfig "$RUNNER_TEMP/baikor-ci.kubeconfig"
          --context k3d-baikor-ci

      - name: Test the real bootstrap Job on a fresh database
        run: >-
          python scripts/ci_database_bootstrap.py
          --kubeconfig "$RUNNER_TEMP/baikor-ci.kubeconfig"
          --context k3d-baikor-ci
          --image "$POSTGIS_TEST_IMAGE"

      - name: Remove the disposable test cluster
        if: always()
        run: |
          if [ -x "$RUNNER_TEMP/k3d" ]; then
            "$RUNNER_TEMP/k3d" cluster delete baikor-ci
          fi
