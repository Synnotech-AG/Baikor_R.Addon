---
- name: "Baikor_R ingress: Create TLS certificate"
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    namespace: "{{ k8s_namespace }}"
    definition:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: baikor-r-tls
      spec:
        secretName: baikor-r-tls
        issuerRef:
          kind: ClusterIssuer
          name: "{{ inv_k8s.cert_manager.issuer_name }}"
        dnsNames:
          - "{{ inv_addons.baikor_r.subdomain | default('baikor-r') }}.{{ INGRESS_DOMAIN | default(DOMAIN) }}"
