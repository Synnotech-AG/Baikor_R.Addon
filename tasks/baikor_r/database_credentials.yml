---
- name: "Baikor_R database: Inspect runtime and migration Secrets"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    namespace: "{{ inv_addons.baikor_r.database.namespace }}"
    kind: Secret
    name: "{{ login.secret }}"
  loop:
    - secret: "{{ inv_addons.baikor_r.database.application_secret }}"
      username: "{{ inv_addons.baikor_r.database.bootstrap.application_username }}"
    - secret: "{{ inv_addons.baikor_r.database.migration_secret }}"
      username: "{{ inv_addons.baikor_r.database.bootstrap.migration_username }}"
  loop_control:
    loop_var: login
  register: baikor_generated_logins
  no_log: true

- name: "Baikor_R database: Generate missing credentials once without rotating existing Secrets"
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    namespace: "{{ inv_addons.baikor_r.database.namespace }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ result.login.secret }}"
      type: Opaque
      stringData:
        username: "{{ result.login.username }}"
        password: "{{ lookup('ansible.builtin.password', '/dev/null', length=48, chars=['ascii_letters', 'digits']) }}"
  loop: "{{ baikor_generated_logins.results }}"
  loop_control:
    loop_var: result
  when: result.resources | length == 0
  no_log: true
