---
- name: "Baikor_R Keycloak: Trust platform CA without bypassing certificate validation"
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    namespace: "{{ k8s_namespace }}"
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: baikor-r-platform-ca
      data:
        ca.crt: "{{ lookup('file', inv_k8s.ingress.ca_path) }}"
  when: inv_k8s.ingress.ca_path | default('') | length > 0

- name: "Baikor_R Keycloak: Read platform administrator credentials"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    namespace: "{{ inv_access.ns_name }}"
    kind: Secret
    name: "{{ inv_access.platform.k8s_secret_name }}"
  register: baikor_keycloak_admin_credentials
  no_log: true

- name: "Baikor_R Keycloak: Login"
  ansible.builtin.uri:
    method: POST
    url: "{{ inv_access.platform.hostname }}/realms/master/protocol/openid-connect/token"
    return_content: true
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    body_format: form-urlencoded
    body:
      grant_type: password
      client_id: admin-cli
      username: "{{ baikor_keycloak_admin_credentials.resources[0].data.MASTER_USERNAME | b64decode }}"
      password: "{{ baikor_keycloak_admin_credentials.resources[0].data.MASTER_PASSWORD | b64decode }}"
    status_code: 200
  register: baikor_keycloak_login
  no_log: true

- name: "Baikor_R Keycloak: Create OIDC client"
  ansible.builtin.uri:
    method: POST
    url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/clients"
    return_content: true
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    body_format: json
    body: "{{ lookup('template', addon_dir | default('') + 'templates/keycloak_client.json.j2') }}"
    headers:
      Authorization: "Bearer {{ baikor_keycloak_login.json.access_token }}"
    status_code: [201, 409]
  no_log: true

- name: "Baikor_R Keycloak: Find OIDC client"
  ansible.builtin.uri:
    method: GET
    url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/clients?clientId=baikor-r"
    return_content: true
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    headers:
      Authorization: "Bearer {{ baikor_keycloak_login.json.access_token }}"
    status_code: 200
  register: baikor_keycloak_clients
  no_log: true

- name: "Baikor_R Keycloak: Store client identifier"
  ansible.builtin.set_fact:
    baikor_keycloak_client_uuid: "{{ baikor_keycloak_clients.json[0].id }}"

- name: "Baikor_R Keycloak: Reconcile existing OIDC client configuration"
  ansible.builtin.uri:
    method: PUT
    url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/clients/{{ baikor_keycloak_client_uuid }}"
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    body_format: json
    body: "{{ lookup('template', addon_dir + 'templates/keycloak_client.json.j2') }}"
    headers:
      Authorization: "Bearer {{ baikor_keycloak_login.json.access_token }}"
    status_code: 204
  no_log: true

- name: "Baikor_R Keycloak: Create application roles"
  ansible.builtin.uri:
    method: POST
    url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/clients/{{ baikor_keycloak_client_uuid }}/roles"
    return_content: true
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    body_format: json
    body:
      name: "{{ baikor_role_name }}"
      description: "Baikor_R role {{ baikor_role_name }}"
      composite: false
      clientRole: true
    headers:
      Authorization: "Bearer {{ baikor_keycloak_login.json.access_token }}"
    status_code: [201, 409]
  loop:
    - baikor_viewer
    - baikor_editor
    - baikor_approver
    - baikor_admin
  loop_control:
    loop_var: baikor_role_name
  no_log: true

- name: "Baikor_R Keycloak: Read client secret"
  ansible.builtin.uri:
    method: GET
    url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/clients/{{ baikor_keycloak_client_uuid }}/client-secret"
    return_content: true
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    headers:
      Authorization: "Bearer {{ baikor_keycloak_login.json.access_token }}"
    status_code: 200
  register: baikor_keycloak_client_secret
  no_log: true

- name: "Baikor_R Keycloak: Create application client secret"
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ k8s_config }}"
    context: "{{ k8s_context }}"
    namespace: "{{ k8s_namespace }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: baikor-r-keycloak
      type: Opaque
      stringData:
        clientSecret: "{{ baikor_keycloak_client_secret.json.value }}"
  no_log: true

- name: "Baikor_R Keycloak: Configure optional import service account"
  ansible.builtin.include_tasks: "{{ addon_dir }}tasks/baikor_r/import_client.yml"
  when: inv_addons.baikor_r.imports.service_account.enable | default(false) | bool

- name: "Baikor_R Keycloak: Find platform administrator user"
  ansible.builtin.uri:
    method: GET
    url: >-
      {{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name
      }}/users?username={{ baikor_keycloak_admin_credentials.resources[0].data.MASTER_USERNAME
      | b64decode | urlencode }}&exact=true
    return_content: true
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    headers:
      Authorization: "Bearer {{ baikor_keycloak_login.json.access_token }}"
    status_code: 200
  register: baikor_keycloak_admin_users
  when: inv_addons.baikor_r.authentication.assign_platform_admin_roles | default(false) | bool
  no_log: true

- name: "Baikor_R Keycloak: Read role representations"
  ansible.builtin.uri:
    method: GET
    url: "{{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name }}/clients/{{ baikor_keycloak_client_uuid }}/roles"
    return_content: true
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    headers:
      Authorization: "Bearer {{ baikor_keycloak_login.json.access_token }}"
    status_code: 200
  register: baikor_keycloak_roles
  when: inv_addons.baikor_r.authentication.assign_platform_admin_roles | default(false) | bool
  no_log: true

- name: "Baikor_R Keycloak: Assign all roles to platform administrator"
  ansible.builtin.uri:
    method: POST
    url: >-
      {{ inv_access.platform.hostname }}/admin/realms/{{ inv_access.tenant.realm_name
      }}/users/{{ baikor_keycloak_admin_users.json[0].id
      }}/role-mappings/clients/{{ baikor_keycloak_client_uuid }}
    return_content: true
    ca_path: "{{ inv_k8s.ingress.ca_path }}"
    body_format: json
    body: "{{ baikor_keycloak_roles.json }}"
    headers:
      Authorization: "Bearer {{ baikor_keycloak_login.json.access_token }}"
    status_code: 204
  when:
    - inv_addons.baikor_r.authentication.assign_platform_admin_roles | default(false) | bool
    - baikor_keycloak_admin_users.json | length > 0
  no_log: true
