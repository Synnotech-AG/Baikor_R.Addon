---
- name: "Baikor_R mail: Ensure a dedicated encryption key exists and preserve its value"
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ playbook_dir }}/{{ addon_dir }}scripts/deployment/mail_import_key.py"
      - --kubeconfig
      - "{{ k8s_config }}"
      - --context
      - "{{ k8s_context }}"
      - --namespace
      - "{{ k8s_namespace }}"
      - --name
      - "{{ inv_addons.baikor_r.mail_imports.encryption_secret | default('baikor-r-mail-encryption') }}"
      - --mode
      - "{{ 'check' if ansible_check_mode else 'apply' }}"
  register: baikor_mail_key_result
  changed_when: baikor_mail_key_result.stdout == 'changed'
  check_mode: false
  no_log: true
